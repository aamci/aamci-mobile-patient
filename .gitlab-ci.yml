# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Health Platform — GitLab CI/CD                                            ║
# ║  mobile-patient  |  mobile-pro                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Déclencheurs :
#   • Merge Request vers main    → test uniquement (path-based)
#   • Push sur main              → test + déploiement beta (Firebase / TestFlight)
#   • Tag mobile-patient/v*      → déploiement production patient (manuel)
#   • Tag mobile-pro/v*          → déploiement production pro (manuel)
#
# Runners requis :
#   • Android / test : runner Linux avec image Docker cirruslabs/flutter
#   • iOS            : runner macOS self-hosted avec tag "macos" et Flutter installé
#
# Variables CI/CD à définir dans GitLab → Settings → CI/CD → Variables :
#   Voir section "Secrets" en bas de ce fichier.

stages:
  - test
  - beta
  - release

# ─── Images & bases communes ──────────────────────────────────────────────────

# Image Flutter officielle cirruslabs (Flutter + Android SDK + Java 17)
# https://github.com/cirruslabs/docker-images-flutter
variables:
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"

# Base Android : runner Linux + Docker
.android-base:
  image: $FLUTTER_IMAGE
  before_script:
    - flutter --version
    - java -version
    - cd "$APP_DIR"
    - gem install bundler --no-document --quiet
    - bundle install --quiet

# Base iOS : runner macOS self-hosted (tag "macos")
# Flutter, Xcode et CocoaPods doivent être installés sur le runner.
.ios-base:
  tags:
    - macos
    - ios
  before_script:
    - flutter --version
    - cd "$APP_DIR"
    - cd ios && pod install --repo-update && cd ..
    - gem install bundler --no-document --quiet
    - bundle install --quiet

# ─── mobile-patient ───────────────────────────────────────────────────────────

test:mobile-patient:
  extends: .android-base
  stage: test
  variables:
    APP_DIR: apps/mobile-patient
  rules:
    # Sur toute MR qui modifie l'app patient
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/mobile-patient/**/*
        - .gitlab-ci.yml
    # Sur push vers main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/mobile-patient/**/*
    # Sur tag de release patient
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test --coverage
  coverage: '/lines\s*:\s*\d+\.\d+%/'
  artifacts:
    paths:
      - apps/mobile-patient/coverage/lcov.info
    expire_in: 1 week

deploy:patient:android:beta:
  extends: .android-base
  stage: beta
  needs: ["test:mobile-patient"]
  variables:
    APP_DIR: apps/mobile-patient
    BUILD_NUMBER: $CI_PIPELINE_IID
    ANDROID_KEYSTORE_BASE64: $ANDROID_PATIENT_KEYSTORE_BASE64
    ANDROID_STORE_PASSWORD: $ANDROID_PATIENT_STORE_PASSWORD
    ANDROID_KEY_ALIAS: $ANDROID_PATIENT_KEY_ALIAS
    ANDROID_KEY_PASSWORD: $ANDROID_PATIENT_KEY_PASSWORD
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/mobile-patient/**/*
  environment:
    name: mobile-patient/beta
  script:
    - bundle exec fastlane android beta

deploy:patient:android:release:
  extends: .android-base
  stage: release
  needs: ["test:mobile-patient"]
  when: manual
  variables:
    APP_DIR: apps/mobile-patient
    BUILD_NUMBER: $CI_PIPELINE_IID
    ANDROID_KEYSTORE_BASE64: $ANDROID_PATIENT_KEYSTORE_BASE64
    ANDROID_STORE_PASSWORD: $ANDROID_PATIENT_STORE_PASSWORD
    ANDROID_KEY_ALIAS: $ANDROID_PATIENT_KEY_ALIAS
    ANDROID_KEY_PASSWORD: $ANDROID_PATIENT_KEY_PASSWORD
    GOOGLE_PLAY_JSON_KEY: $GOOGLE_PLAY_PATIENT_JSON_KEY
  rules:
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
      when: manual
  environment:
    name: mobile-patient/production
  script:
    - bundle exec fastlane android release

deploy:patient:ios:beta:
  extends: .ios-base
  stage: beta
  needs: ["test:mobile-patient"]
  variables:
    APP_DIR: apps/mobile-patient
    BUILD_NUMBER: $CI_PIPELINE_IID
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/mobile-patient/**/*
  environment:
    name: mobile-patient/beta
  script:
    - bundle exec fastlane ios beta

deploy:patient:ios:release:
  extends: .ios-base
  stage: release
  needs: ["test:mobile-patient"]
  when: manual
  variables:
    APP_DIR: apps/mobile-patient
    BUILD_NUMBER: $CI_PIPELINE_IID
  rules:
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
      when: manual
  environment:
    name: mobile-patient/production
  script:
    - bundle exec fastlane ios release

