# ─── CI/CD — Mobile Patient (Flutter) ────────────────────────────────────────
#
# Pipeline autonome — à configurer comme CI config path dans le projet GitLab :
#   Settings → CI/CD → General pipelines → CI/CD configuration file
#   → apps/mobile-patient/.gitlab-ci.yml
#
# Déclencheurs :
#   • Push sur n'importe quelle branche / MR   → test
#   • Push sur main                            → test + beta (Android + iOS)
#   • Tag mobile-patient/v*.*.*                → production (manuel)
#
# Runners requis :
#   • Linux (Docker) : test + Android
#   • macOS self-hosted (tags: macos, ios) : iOS uniquement
#
# Variables à configurer (GitLab → Settings → CI/CD → Variables) :
#   ANDROID_PATIENT_KEYSTORE_BASE64     base64 du fichier .jks
#   ANDROID_PATIENT_STORE_PASSWORD
#   ANDROID_PATIENT_KEY_ALIAS
#   ANDROID_PATIENT_KEY_PASSWORD
#   FIREBASE_PATIENT_APP_ID             App ID Firebase App Distribution (beta)
#   GOOGLE_PLAY_PATIENT_JSON_KEY        JSON service account Google Play (release)
#   APPLE_ID
#   APPLE_DEVELOPER_TEAM_ID
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT   fichier .p8 encodé en base64
#   MATCH_GIT_URL                       SSH/HTTPS du dépôt privé Match
#   MATCH_PASSWORD

stages:
  - test
  - beta
  - release

variables:
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  APP_DIR: "."
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

# ─── Bases ────────────────────────────────────────────────────────────────────

.android-base:
  image: $FLUTTER_IMAGE
  tags:
    - flutter
    - android
  cache:
    key: "android-patient-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
      - .pub-cache/
    policy: pull-push
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - flutter --version
    - java -version
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-34" > /dev/null 2>&1
    - mkdir -p ~/.gradle && printf 'org.gradle.daemon=false\norg.gradle.parallel=false\n' > ~/.gradle/gradle.properties
    - cd "$APP_DIR"
    - gem install bundler -v "2.5.0" --no-document --quiet
    - bundle _2.5.0_ install --quiet

.ios-base:
  tags:
    - macos
    - ios
  before_script:
    - export LANG=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    - export RUBYOPT="-Eutf-8:utf-8"
    - export PATH="/usr/local/opt/ruby@3.3/bin:$PATH"
    - export GEM_HOME="$HOME/.gem-x86"
    - export PATH="$GEM_HOME/bin:$PATH"
    - ruby --version
    - flutter --version
    - cd "$APP_DIR"
    - gem install bundler -v "2.5.0" --no-document --quiet
    - arch -x86_64 bundle _2.5.0_ install --quiet
    - cd ios && LANG=en_US.UTF-8 RUBYOPT="-Eutf-8:utf-8" /usr/local/bin/pod install --repo-update && cd ..

# ─── Validation README ────────────────────────────────────────────────────────

validate:readme:mobile-patient:
  image: node:20-alpine
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
  script:
    - node scripts/validate-readme.js
  allow_failure: false

# ─── Test ─────────────────────────────────────────────────────────────────────

test:mobile-patient:
  extends: .android-base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test --coverage
  coverage: '/lines\s*:\s*\d+\.\d+%/'
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 week

# ─── Android ──────────────────────────────────────────────────────────────────

deploy:patient:android:beta:
  extends: .android-base
  stage: beta
  needs: ["test:mobile-patient"]
  variables:
    BUILD_NUMBER: $CI_PIPELINE_IID
    ANDROID_KEYSTORE_BASE64: $ANDROID_PATIENT_KEYSTORE_BASE64
    ANDROID_STORE_PASSWORD: $ANDROID_PATIENT_STORE_PASSWORD
    ANDROID_KEY_ALIAS: $ANDROID_PATIENT_KEY_ALIAS
    ANDROID_KEY_PASSWORD: $ANDROID_PATIENT_KEY_PASSWORD
    GOOGLE_PLAY_JSON_KEY: $GOOGLE_PLAY_PATIENT_JSON_KEY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: mobile-patient/beta
  script:
    - bundle exec fastlane android beta

deploy:patient:android:release:
  extends: .android-base
  stage: release
  needs: ["test:mobile-patient"]
  when: manual
  variables:
    BUILD_NUMBER: $CI_PIPELINE_IID
    ANDROID_KEYSTORE_BASE64: $ANDROID_PATIENT_KEYSTORE_BASE64
    ANDROID_STORE_PASSWORD: $ANDROID_PATIENT_STORE_PASSWORD
    ANDROID_KEY_ALIAS: $ANDROID_PATIENT_KEY_ALIAS
    ANDROID_KEY_PASSWORD: $ANDROID_PATIENT_KEY_PASSWORD
    GOOGLE_PLAY_JSON_KEY: $GOOGLE_PLAY_PATIENT_JSON_KEY
  rules:
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
      when: manual
  environment:
    name: mobile-patient/production
  script:
    - bundle exec fastlane android release

# ─── iOS ──────────────────────────────────────────────────────────────────────

deploy:patient:ios:beta:
  extends: .ios-base
  stage: beta
  needs: ["test:mobile-patient"]
  variables:
    BUILD_NUMBER: $CI_PIPELINE_IID
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: mobile-patient/beta
  script:
    - bundle exec fastlane ios beta

deploy:patient:ios:release:
  extends: .ios-base
  stage: release
  needs: ["test:mobile-patient"]
  when: manual
  variables:
    BUILD_NUMBER: $CI_PIPELINE_IID
  rules:
    - if: $CI_COMMIT_TAG =~ /^mobile-patient\/v.*/
      when: manual
  environment:
    name: mobile-patient/production
  script:
    - bundle exec fastlane ios release
