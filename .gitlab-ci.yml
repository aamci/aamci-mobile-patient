# ─── Variables CI/CD à configurer dans GitLab ─────────────────────────────────
#
# GitLab → Settings → CI/CD → Variables
# Toutes marquées "Masked" et "Protected" sauf indication contraire.
#
# Android — patient
#   ANDROID_PATIENT_KEYSTORE_BASE64   base64 du fichier .jks/.keystore
#   ANDROID_PATIENT_STORE_PASSWORD    mot de passe du keystore
#   ANDROID_PATIENT_KEY_ALIAS         alias de la clé
#   ANDROID_PATIENT_KEY_PASSWORD      mot de passe de la clé
#   FIREBASE_PATIENT_APP_ID           App ID Firebase (distribution beta Android)
#   GOOGLE_PLAY_PATIENT_JSON_KEY      JSON service account Google Play (production)
#
# Android — pro
#   ANDROID_PRO_KEYSTORE_BASE64
#   ANDROID_PRO_STORE_PASSWORD
#   ANDROID_PRO_KEY_ALIAS
#   ANDROID_PRO_KEY_PASSWORD
#   FIREBASE_PRO_APP_ID
#   GOOGLE_PLAY_PRO_JSON_KEY
#
# iOS — partagé entre les deux apps
#   APPLE_ID                           exemple : dev@healthplatform.com
#   APPLE_DEVELOPER_TEAM_ID            exemple : ABCD1234EF
#   APP_STORE_CONNECT_TEAM_ID          ID équipe App Store Connect
#   APP_STORE_CONNECT_API_KEY_ID       ID de la clé API .p8
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID  Issuer ID de la clé API
#   APP_STORE_CONNECT_API_KEY_CONTENT  contenu du fichier .p8 encodé en base64
#   MATCH_GIT_URL                      SSH ou HTTPS du dépôt privé Match
#   MATCH_PASSWORD                     mot de passe de chiffrement Match
